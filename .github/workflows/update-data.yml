name: Update data

on:
  schedule:
    - cron: "0 9 1,16 * *"
    - cron: "0 12 * * 3"
    - cron: "40 4 * * *"
  workflow_dispatch:
    inputs:
      what:
        description: Что обновить
        type: choice
        options: [all, abyss, onslaught, content, teams]
        default: all
  push:
    branches: [main]
    paths:
      - "tools/**"
      - ".github/workflows/update-data.yml"

permissions:
  contents: write
  pages: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Pillow (иконки оружия и сетов)
        run: pip install --quiet pillow

      - name: Check imported simulation assumptions
        run: python -m unittest discover -s tools -p "test_*.py"

      - name: Что запускать
        id: plan
        env:
          EVENT_NAME: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
          UPDATE_WHAT: ${{ inputs.what }}
        run: |
          content=none; teams=false
          case "$EVENT_NAME" in
            schedule)
              case "$SCHEDULE" in
                "0 9 1,16 * *") content=abyss ;;
                "0 12 * * 3") content=onslaught ;;
                "40 4 * * *") teams=true ;;
                *) echo "Unknown schedule: $SCHEDULE"; exit 1 ;;
              esac ;;
            workflow_dispatch)
              case "$UPDATE_WHAT" in
                abyss|onslaught) content="$UPDATE_WHAT" ;;
                content) content=all ;;
                teams) teams=true ;;
                *) content=all; teams=true ;;
              esac ;;
            *) content=all; teams=true ;;
          esac
          echo "content=$content" >> "$GITHUB_OUTPUT"
          echo "teams=$teams" >> "$GITHUB_OUTPUT"

      # Шаги не валят друг друга: если вики недоступна, база отрядов всё равно
      # обновится, а упавший шаг подсветит весь запуск красным в конце.
      - name: Бездна и Натиск
        id: content
        if: steps.plan.outputs.content != 'none'
        continue-on-error: true
        env:
          CONTENT_SCOPE: ${{ steps.plan.outputs.content }}
        run: python tools/build_content.py --only "$CONTENT_SCOPE"

      - name: База отрядов
        id: teams
        if: steps.plan.outputs.teams == 'true'
        continue-on-error: true
        run: python tools/build_db.py --icons

      # Статические страницы для поисковиков пересобираются из свежих данных;
      # без изменений данных они остаются байт-в-байт теми же
      - name: Страницы для поиска
        id: pages
        continue-on-error: true
        run: python tools/build_pages.py

      - name: Коммит изменений
        id: commit
        run: |
          git add data enemies weapons sets en ru sitemap.xml sitemap.txt index.html
          if git diff --cached --quiet; then
            echo "Данные не изменились — коммитить нечего"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          parts=""
          git diff --cached --quiet -- data/content.json enemies || parts="Abyss/Onslaught"
          git diff --cached --quiet -- data/db.json data/details data/refs.json data/names.en.json data/names.ru.json weapons sets \
            || parts="${parts:+$parts, }teams"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "data: update ${parts:-data}"
          # пока шёл запуск, в main могли что-то запушить
          git pull --rebase --quiet origin main
          git push origin HEAD:main
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Публикация обновлений на GitHub Pages
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/$GITHUB_REPOSITORY/pages/builds" --silent

      - name: Итог
        if: steps.content.outcome == 'failure' || steps.teams.outcome == 'failure' || steps.pages.outcome == 'failure'
        run: |
          echo "::error::Шаг обновления упал: content=${{ steps.content.outcome }}, teams=${{ steps.teams.outcome }}, pages=${{ steps.pages.outcome }}"
          exit 1
